<!-- ── Left sidebar ─────────────────────────────────────────────────────── -->
<button class="sidebar-toggle" id="sidebar-toggle" aria-label="Toggle navigation">
  <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="18" x2="21" y2="18"/></svg>
</button>

<aside class="sidebar" id="sidebar">
  <a href="/" class="sidebar-logo">
    <img src="/static/img/vine_infotech_logo.png" class="sidebar-logo-full" alt="Vine InfoTech">
    <img src="/static/img/vine_infotech_mark.png" class="sidebar-logo-mark" alt="Vine InfoTech">
    <span class="sidebar-wordmark-sub">ClockWork PM</span>
  </a>

  <nav class="sidebar-nav" aria-label="Main navigation">

    <a href="/timesheet" class="nav-link {% if active == 'timesheet' %}active{% endif %}">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="4" width="18" height="18" rx="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/><line x1="8" y1="14" x2="8" y2="14"/><line x1="12" y1="14" x2="12" y2="14"/><line x1="16" y1="14" x2="16" y2="14"/></svg>
      <span class="nav-label">My Timesheet</span>
    </a>

    <a href="/dashboard" class="nav-link {% if active == 'dashboard' %}active{% endif %}">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>
      <span class="nav-label">Dashboard</span>
    </a>

    <a href="/reports" class="nav-link {% if active == 'reports' %}active{% endif %}">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><line x1="18" y1="20" x2="18" y2="10"/><line x1="12" y1="20" x2="12" y2="4"/><line x1="6" y1="20" x2="6" y2="14"/></svg>
      <span class="nav-label">Reports</span>
    </a>

    {% if current_user.role in ('Manager', 'Admin') %}
    <div class="sidebar-sep"></div>
    <div class="sidebar-section-label">Admin</div>

    <a href="/admin/projects" class="nav-link {% if active == 'admin-projects' %}active{% endif %}">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="2" y="7" width="20" height="14" rx="2"/><path d="M16 7V5a2 2 0 0 0-2-2h-4a2 2 0 0 0-2 2v2"/></svg>
      <span class="nav-label">Projects</span>
    </a>

    <a href="/admin/users" class="nav-link {% if active == 'admin-users' %}active{% endif %}">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg>
      <span class="nav-label">Users</span>
    </a>
    {% endif %}

  </nav>

  <!-- User chip -->
  <div class="sidebar-user">
    <div class="sidebar-user-avatar">{{ current_user.name[:2] | upper }}</div>
    <div class="sidebar-user-info">
      <span class="sidebar-user-name">{{ current_user.name }}</span>
      <span class="sidebar-user-title">{{ current_user.role }}</span>
    </div>
    <a href="/logout" class="sidebar-logout" title="Sign out">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>
    </a>
  </div>
</aside>

<div class="sidebar-overlay" id="sidebar-overlay"></div>

<script>
(function() {
  var sidebar = document.getElementById('sidebar');
  var overlay = document.getElementById('sidebar-overlay');
  var toggle  = document.getElementById('sidebar-toggle');
  if (!toggle) return;
  toggle.addEventListener('click', function() {
    var open = sidebar.classList.toggle('expanded');
    overlay.classList.toggle('visible', open);
  });
  overlay.addEventListener('click', function() {
    sidebar.classList.remove('expanded');
    overlay.classList.remove('visible');
  });
})();
</script>
