<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <link rel="icon" type="image/x-icon" href="/static/img/favicon.ico">
  <title>Sign In – ClockWork PM</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/static/css/clockwork.css">
  <style>
    body { display:flex; align-items:center; justify-content:center; min-height:100vh; background:var(--bg); }
    .login-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      box-shadow: var(--shadow-md);
      padding: 2.5rem 2rem;
      width: 100%;
      max-width: 400px;
      border-left: 4px solid var(--primary);
    }
    .login-logo { display:flex; flex-direction:column; align-items:flex-start; gap:.3rem; margin-bottom:1.75rem; }
    .login-logo img { display:block; width:150px; height:auto; }
    .login-app-name { font-size:15px; font-weight:700; color:var(--primary); letter-spacing:.01em; }
    .login-title { font-size:20px; font-weight:700; color:var(--text); margin-bottom:.25rem; }
    .login-sub   { font-size:13px; color:var(--muted); margin-bottom:1.75rem; }
    .login-error {
      background:var(--status-red-bg); color:var(--status-red-text);
      border:1px solid #FECDC9; border-radius:var(--radius-sm);
      padding:.6rem .85rem; font-size:13px; margin-bottom:1rem;
      display:none;
    }
    .login-error.visible { display:block; }
  </style>
</head>
<body>
  <div class="login-card">
    <div class="login-logo">
      <img src="/static/img/vine_infotech_logo.png" alt="Vine InfoTech">
      <span class="login-app-name">ClockWork PM</span>
    </div>

    <div class="login-title">Sign in</div>
    <div class="login-sub">Enter your credentials to continue</div>

    {% if error %}
    <div class="login-error visible">{{ error }}</div>
    {% endif %}

    <form method="post" action="/login" novalidate>
      {% if next %}<input type="hidden" name="next" value="{{ next }}"/>{% endif %}
      <div class="form-group" style="margin-bottom:1rem;">
        <label class="form-label" for="email">Email</label>
        <input class="form-control" id="email" name="email" type="email"
               autocomplete="username" autofocus required
               value="{{ email or '' }}"/>
      </div>
      <div class="form-group" style="margin-bottom:1.5rem;">
        <label class="form-label" for="password">Password</label>
        <input class="form-control" id="password" name="password" type="password"
               autocomplete="current-password" required/>
      </div>
      <button type="submit" class="btn btn-primary" style="width:100%;justify-content:center;">
        Sign in
      </button>
    </form>
  </div>
</body>
</html>
