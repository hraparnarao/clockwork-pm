services:
  - type: web
    name: clockwork-pm
    runtime: python
    buildCommand: pip install -r requirements.txt
    preDeployCommand: python seed.py
    startCommand: gunicorn -w 2 -k uvicorn.workers.UvicornWorker -b 0.0.0.0:$PORT main:app
    envVars:
      - key: PYTHON_VERSION
        value: "3.11.9"
